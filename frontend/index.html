<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PhishGuard AI 2.0 — AI-Assisted Phishing Detection & Threat Intelligence Platform" />
    <title>PhishGuard AI 3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body style="background-color: #030712; color: #f1f5f9; margin: 0; font-family: 'Inter', -apple-system, sans-serif;">
    <div id="root">
      <div id="pg-init-loader" style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#030712;padding:20px;text-align:center;">
        <div style="width:38px;height:38px;border:3px solid rgba(0,194,255,0.2);border-top:3px solid #00c2ff;border-radius:50%;animation:pg_spin 1s linear infinite;"></div>
        <div style="font-size:12px;color:#00c2ff;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">PhishGuard AI 3.0</div>
        <div id="pg-init-msg" style="font-size:11px;color:#64748b;">Loading SOC workspace...</div>
        <div id="pg-init-fallback" style="display:none;margin-top:10px;max-width:420px;padding:14px 18px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;font-size:12px;line-height:1.5;">
          <div style="font-weight:700;color:#ef4444;margin-bottom:4px;">INITIALIZATION DEGRADED</div>
          <div>Workspace asset loading or backend connection is taking longer than expected.</div>
          <button onclick="window.location.reload()" style="margin-top:10px;padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:12px;cursor:pointer;">Retry / Reload</button>
        </div>
      </div>
      <style>@keyframes pg_spin{to{transform:rotate(360deg)}}</style>
      <script>
        setTimeout(function() {
          var fb = document.getElementById('pg-init-fallback');
          var msg = document.getElementById('pg-init-msg');
          if (fb && msg) {
            msg.innerText = 'Initialization delayed';
            fb.style.display = 'block';
          }
        }, 5000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
